<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Leaflet 地図レイヤー制御</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <script src="https://unpkg.com/leaflet.markercluster@1.3.0/dist/leaflet.markercluster.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.Default.css" />
        <script src="./L.KML.js"></script>
        <!-- 雨雲レイヤーのJavaScript/CSS読み込み -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mwasil/Leaflet.Rainviewer/leaflet.rainviewer.css"/>
        <script src="https://cdn.jsdelivr.net/gh/mwasil/Leaflet.Rainviewer/leaflet.rainviewer.js"></script>
    </head>
    <body>
        <div id="map" style="height: 80vh"></div>
        <script>
            // 1. 地図の初期化
            const map = L.map('map', {
                center: [34.546540, 135.504459],
                zoom: 10,
            });

            // 2. 背景レイヤーの定義
            const backgroundLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            });

            const chiriinLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: "地理院地図"
            });

            // 3. レイヤーコントロールの作成（背景地図のみ先に登録）
            const LayerControl = L.control.layers({
                "地理院地図（標準）": chiriinLayer,
                "OpenStreetMap": backgroundLayer
            }, null).addTo(map);

            // 初期背景を設定
            chiriinLayer.addTo(map);
            L.control.scale().addTo(map);

            // 4. 固定ピン（なかもず）
            const nakamozu_marker = L.marker([34.544865, 135.506274])
                .bindPopup('なかもずキャンパスC棟')
                .addTo(map);

            // 5. GeoJSON（大阪府の学校データ）の読み込み（クラスタ化対応）
			fetch('./P29-21_27.geojson')
    			.then(res => res.json())
    			.then(json => {
        			// 1. クラスタグループを作成
        			const osakaCluster = L.markerClusterGroup();

        			// 2. GeoJSONレイヤーを作成（ここでは地図に追加せず、データとして作成）
        			const osakaSchools = L.geoJSON(json, {
            			onEachFeature: function (feature, layer) {
                			// 各ピンにポップアップを設定
                			layer.bindPopup(feature.properties.P29_004);
            			}
        			});

        			// 3. クラスタグループにGeoJSONレイヤーを追加
        			osakaCluster.addLayer(osakaSchools);
        
        			// 4. クラスタグループを地図とレイヤーコントロールに追加
        			osakaCluster.addTo(map);
        			LayerControl.addOverlay(osakaCluster, "大阪府の学校（クラスタ）");
    			});

            // 6. 全国版（クラスタリング）の読み込み
            fetch('./P29-21.geojson')
                .then(res => res.json())
                .then(json => {
                    const clusterGroup = L.markerClusterGroup()
                        .bindPopup(layer => layer.feature.properties.P29_004);
                    
                    const geojsonLayer = L.geoJSON(json);
                    clusterGroup.addLayer(geojsonLayer);
                    
                    // 全国版は重いので初期表示はオフ（addToしない）
                    LayerControl.addOverlay(clusterGroup, "全国の学校（クラスタ）");
                });

            // 7. KML（ルート）の読み込み
            fetch("./niigata_route.kml")
                .then(res => res.text())
                .then(kmltext => {
                    const parser = new DOMParser();
                    const kml = parser.parseFromString(kmltext, 'text/xml');
                    const track = new L.KML(kml);
                    
                    track.addTo(map);
                    LayerControl.addOverlay(track, "新潟ルート");

                    const bounds = track.getBounds();
                    map.fitBounds(bounds);
                });

            // ラインレイヤーを作成
            fetch('./line.geojson') // ラインデータの非同期読み込み
	            .then((response) => response.json())
	            .then((data) => {
	            var line = L.geoJSON(data, {
	    		    "color": "#FF00FF",// 色
		            "weight": 6,  // サイズ
		            "opacity": 0.65   // 透過度
		        })
	            map.addLayer(line)
	            LayerControl.addOverlay(line, "ルート")
                });

            // 雨雲レイヤーを追加
            L.control.rainviewer({ 
	            position: 'bottomleft',
	            nextButtonText: '>',
	            playStopButtonText: 'Play/Stop',
	            prevButtonText: '<',
	            positionSliderLabelText: "Hour:",
	            opacitySliderLabelText: "Opacity:",
	            animationInterval: 500,
	            opacity: 0.5
                }).addTo(map);

            // 行政区域レイヤーを作成
            fetch("./N03-23_27_230101.geojson") // 行政区域データを非同期読み込み
                .then((response) => response.json())
                .then((data) => {
                    // 特定の値によりGeoJSONをフィルタリング
                    var filteredData = data.features.filter(feature => feature.properties.N03_004 === '寝屋川市');
                    var selected_area = L.geoJSON(filteredData)
                        .bindPopup((layer) => layer.feature.properties.N03_004) // ポップアップで表示
                    map.addLayer(selected_area)
                    // チェックボックス
                    LayerControl.addOverlay(selected_area, "行政区域")
                    // GeoJSONレイヤに地図がフィットするように表示範囲を自動調整
                    map.fitBounds(selected_area.getBounds());
            });

            map.attributionControl.addAttribution(
                '<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P29-v2_0.html">国土数値情報 - 学校データ</a>'
            );
        </script>
    </body>

</html>
