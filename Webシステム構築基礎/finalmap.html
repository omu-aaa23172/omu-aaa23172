<!DOCTYPE html>
<html>
<head>
    <title>Leaflet 地図レイヤー整理</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.3.0/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.Default.css" />
    <script src="./L.KML.js"></script>
</head>

<body>
    <div id="map" style="height: 80vh"></div>

    <script>
        // 1. 地図インスタンスの初期化
        const map = L.map('map', {
            center: [34.546540, 135.504459],
            zoom: 10,
        });

        // 2. 背景レイヤーの定義
        const backgroundLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        const chiriinLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: "地理院地図"
        });

        // 3. レイヤーコントロールの作成
        const layerControl = L.control.layers({
            "OpenStreetMap": backgroundLayer,
            "地理院地図（標準）": chiriinLayer
        }, null).addTo(map);

        // デフォルト背景とスケールバーの追加
        chiriinLayer.addTo(map);
        L.control.scale().addTo(map);

        // 4. 固定ピン（なかもず）
        const nakamozu_marker = L.marker([34.544865, 135.506274])
            .bindPopup('なかもずキャンパスC棟')
            .addTo(map);

        // 5. 大阪府の学校データの読み込み（クラスタ化）
        fetch('./P29-21_27.geojson')
            .then(res => res.json())
            .then(json => {
                const osakaMarkers = L.markerClusterGroup()
                    .bindPopup(layer => layer.feature.properties.P29_004);
                
                const geojsonLayer = L.geoJSON(json);
                osakaMarkers.addLayer(geojsonLayer);
                osakaMarkers.addTo(map);
                
                layerControl.addOverlay(osakaMarkers, "大阪府の学校（クラスタ）");
            });

        // 6. 全国版学校データの読み込み（クラスタ化）
        fetch('./P29-21.geojson')
            .then(res => res.json())
            .then(json => {
                const nationalMarkers = L.markerClusterGroup()
                    .bindPopup(layer => layer.feature.properties.P29_004);
                
                const geojsonLayer = L.geoJSON(json);
                nationalMarkers.addLayer(geojsonLayer);
                
                // 全国版は重いため、初期表示はオフ（addToしない）
                layerControl.addOverlay(nationalMarkers, "全国の学校（クラスタ）");
            });

        // 7. KMLレイヤー（新潟ルート）
        fetch("./niigata_route.kml")
            .then(res => res.text())
            .then(kmltext => {
                const parser = new DOMParser();
                const kml = parser.parseFromString(kmltext, 'text/xml');
                const track = new L.KML(kml);
                
                track.addTo(map);
                layerControl.addOverlay(track, "新潟ルート");

                // KMLの範囲に合わせる
                const bounds = track.getBounds();
                map.fitBounds(bounds);
            });

        // 8. OSRMルート検索（杉本〜なかもず）
        const routeUrl = 'https://routing.openstreetmap.de/routed-car/route/v1/driving/135.505276,34.592331;135.506274,34.544865?geometries=geojson&overview=full';

        async function addRouteLayer() {
            try {
                const response = await fetch(routeUrl);
                const json = await response.json();
                const routeLayer = L.geoJSON(json['routes'][0]['geometry'], {
                    style: {
                        color: "#FF00FF",
                        weight: 6,
                        opacity: 0.65
                    }
                });
                
                routeLayer.addTo(map);
                layerControl.addOverlay(routeLayer, "杉本-なかもずルート");
            } catch (error) {
                console.error("ルートの取得に失敗しました:", error);
            }
        }
        addRouteLayer();

        
    </script>
</body>
</html>
